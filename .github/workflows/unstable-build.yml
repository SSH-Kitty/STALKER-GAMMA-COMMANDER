# Publishes every push to an unstable branch ("1.4.0-Unstable", ...) as a
# GitHub pre-release, which is what Settings' "Try the unstable build" button
# and the unstable update channel read: they only see releases, never
# branches. Each push gets its own tag, v<version>-unstable<run number>, so
# every build compares newer than the one before it. Older unstable
# pre-releases are deleted afterwards; leaving them in place would push stable
# entries out of the release feed that the app reads its patch notes from.
name: Unstable build

on:
  push:
    branches: ["*-Unstable", "*-unstable"]

permissions:
  contents: write

concurrency:
  group: unstable-build
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install build dependencies
        # The build's Qt smoke test loads QtGui, which links libEGL/libGL.
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1 binutils
      - name: Stamp the unstable version
        id: version
        run: |
          base="$(sed -n 's/^__version__ = "\([0-9.Hh]*\).*"/\1/p' commander_gui/__init__.py)"
          [ -n "$base" ] || { echo "no __version__ in commander_gui/__init__.py" >&2; exit 1; }
          version="${base}-unstable${GITHUB_RUN_NUMBER}"
          sed -i "s/^__version__ = .*/__version__ = \"$version\"/" commander_gui/__init__.py
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build the AppImage
        env:
          QT_QPA_PLATFORM: offscreen
        run: ./build-appimage.sh dist
      - name: Publish the pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          tag="v$VERSION"
          gh release create "$tag" --prerelease --target "$GITHUB_SHA" \
            --title "COMMANDER $VERSION" \
            --notes "Unstable build from branch \`$GITHUB_REF_NAME\` at $GITHUB_SHA. New features sooner, but it may have bugs." \
            "dist/STALKER-GAMMA-COMMANDER-$VERSION-x86_64.AppImage" \
            "dist/STALKER-GAMMA-COMMANDER-$VERSION-x86_64.AppImage.sha512sum"
          gh release list --limit 100 --json tagName,isPrerelease \
            --jq '.[] | select(.isPrerelease) | .tagName' \
            | grep -- '-unstable' | grep -vxF -- "$tag" \
            | while read -r old; do gh release delete "$old" --cleanup-tag --yes; done
