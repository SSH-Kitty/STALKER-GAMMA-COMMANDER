# Publishes an unstable branch ("main-unstable", ...) as a GitHub
# pre-release, only when started by hand - pushes alone publish nothing.
# Runs in the STALKER-GAMMA-COMMANDER-Unstable repo, not the main one, so
# the main repo's Releases page only lists stable builds:
#   git push unstable main-unstable
#   gh workflow run "Unstable build" --ref main-unstable -R SSH-Kitty/STALKER-GAMMA-COMMANDER-Unstable
# (GitHub only offers "Run workflow" for workflows that exist on the
# repo's default branch.) Settings' "Try the unstable build" button and the
# unstable update channel read that repo's releases. Each run gets its own
# tag, v<version>-unstable<run number>, so every build compares newer than
# the one before it. Older unstable pre-releases are deleted afterwards.
name: Unstable build

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: unstable-build
  cancel-in-progress: true

jobs:
  release:
    if: ${{ github.repository == 'SSH-Kitty/STALKER-GAMMA-COMMANDER-Unstable' && (endsWith(github.ref_name, '-Unstable') || endsWith(github.ref_name, '-unstable')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install build dependencies
        # The build's Qt smoke test loads QtGui, which links libEGL/libGL.
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1 binutils
      - name: Stamp the unstable version
        id: version
        run: |
          base="$(sed -n 's/^__version__ = "\([0-9.Hh]*\).*"/\1/p' commander_gui/__init__.py)"
          [ -n "$base" ] || { echo "no __version__ in commander_gui/__init__.py" >&2; exit 1; }
          version="${base}-unstable${GITHUB_RUN_NUMBER}"
          sed -i "s/^__version__ = .*/__version__ = \"$version\"/" commander_gui/__init__.py
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build the AppImage
        env:
          QT_QPA_PLATFORM: offscreen
          # Fresh checkout: the version stamp above is the only change.
          ALLOW_DIRTY: "1"
        run: ./build-appimage.sh dist
      - name: Publish the pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          tag="v$VERSION"
          gh release create "$tag" --prerelease --target "$GITHUB_SHA" \
            --title "COMMANDER $VERSION" \
            --notes "Unstable build from branch \`$GITHUB_REF_NAME\` at $GITHUB_SHA. New features sooner, but it may have bugs." \
            "dist/STALKER-GAMMA-COMMANDER-$VERSION-x86_64.AppImage" \
            "dist/STALKER-GAMMA-COMMANDER-$VERSION-x86_64.AppImage.sha512sum"
          gh release list --limit 100 --json tagName,isPrerelease \
            --jq '.[] | select(.isPrerelease) | .tagName' \
            | grep -- '-unstable' | grep -vxF -- "$tag" \
            | while read -r old; do gh release delete "$old" --cleanup-tag --yes; done
