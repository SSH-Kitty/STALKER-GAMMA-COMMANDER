# Runs the test suite and linter on every push/PR so a regression can't
# merge unnoticed - previously nothing in this repo's CI did either.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install Qt system libraries
        # PySide6's QtGui links against libEGL/libGL even on the offscreen
        # platform; the stock runner image doesn't ship them.
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Test
        # PySide6 needs a display; no GUI is actually shown in CI.
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q
